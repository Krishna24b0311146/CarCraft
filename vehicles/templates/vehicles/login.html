<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CarCraft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(245, 158, 11, 0.08),
                    transparent 30%
                ),
                #080b12;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #111722;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #f59e0b;
        }

        .form-label {
            color: #e2e8f0;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 11px;
            background: #0b1019;
            border: 1px solid #303a49;
            color: #f8fafc;
        }

        .form-control:focus {
            background: #0b1019;
            border-color: #f59e0b;
            color: #f8fafc;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .login-btn {
            padding: 12px;
            border-radius: 11px;
            font-weight: 700;
            background: #f59e0b;
            border: none;
            color: #111827;
            transition: 0.25s;
        }

        .login-btn:hover {
            background: #fbbf24;
            color: #111827;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.2);
        }

        .auth-link {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
            color: #fbbf24;
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #f8fafc;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <div class="text-center mb-4">
        <div class="brand">Car<span>Craft</span></div>
        <p class="text-secondary mb-0">
            Login to your account
        </p>
    </div>

    {% if error %}
        <div class="alert alert-danger py-2" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Username</label>

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   required>
        </div>

        <button type="submit"
                class="btn btn-warning w-100 login-btn">
            Login
        </button>

    </form>

    <p class="text-center text-secondary mt-4 mb-0" style="font-size: 14px;">
        Don't have an account?
        <a href="{% url 'signup' %}" class="auth-link">Create Account</a>
    </p>

    <div class="text-center mt-3">
        <a href="/" class="back-link">
            ← Back to CarCraft
        </a>
    </div>

</div>

</body>
</html>
